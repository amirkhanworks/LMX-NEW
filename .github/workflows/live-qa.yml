name: Live production QA

on:
  workflow_run:
    workflows: ["Deploy Luminox Website"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live-qa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Install Playwright package
        run: npm install --no-save playwright@1.55.0

      - name: Allow Pages propagation
        run: sleep 30

      - name: Run live production QA
        run: |
          mkdir -p qa/live
          node scripts/live-qa.mjs

      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmx-live-production-qa
          path: qa/live/
          retention-days: 7
