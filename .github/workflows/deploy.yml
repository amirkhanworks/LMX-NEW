name: Deploy Luminox Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate hero images when the master or image pipeline changes
        run: |
          if git diff --quiet HEAD^ HEAD -- assets-src/img/hero-living-room.png scripts/hero-image.mjs scripts/images.mjs .github/workflows/deploy.yml; then
            echo "No hero image-source or pipeline changes in this commit; using committed generated assets."
          else
            node scripts/hero-image.mjs
          fi

      - name: Persist regenerated hero assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/hero-living-room-640.avif public/img/hero-living-room-640.webp \
                  public/img/hero-living-room-1024.avif public/img/hero-living-room-1024.webp \
                  public/img/hero-living-room-1600.avif public/img/hero-living-room-1600.webp \
                  public/img/hero-living-room-2400.avif public/img/hero-living-room-2400.webp \
                  public/img/hero-living-room-3840.avif public/img/hero-living-room-3840.webp \
                  public/img/manifest.json
          if git diff --cached --quiet; then
            echo "No regenerated hero asset changes to commit."
          else
            git commit -m "chore: regenerate hero image assets [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build website
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
