name: No Rewiring live QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Allow Pages propagation
        run: sleep 45

      - name: Run focused No Rewiring QA
        run: node scripts/no-rewiring-qa.mjs

      - name: Upload No Rewiring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-rewiring-live-qa
          path: qa/live/no-rewiring/
          retention-days: 7
